<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ScriptGen</title>

    <link rel="stylesheet" href="../css/script.css" />
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">M</div>
          <span>MovCap</span>
        </div>

        <button class="glow-btn">+ New Script</button>
        <button class="story-btn">Go to Story →</button>

        <h3>History</h3>
      </aside>

      <!-- MAIN -->

      <div class="main">
        <!-- HEADER -->

        <div class="header">
          <h3>ScriptGen</h3>
        </div>

        <!-- CHAT AREA -->

        <div class="chat-area">
          <div id="messages">
            <div class="message bot">
              👋 Ask me to generate cinematic movie scripts.
            </div>
          </div>
        </div>

        <!-- INPUT BAR -->

        <div class="input-bar">
          <input
            id="movieInput"
            placeholder="Type your idea... (ex: Aadu 1 recap)"
            autocomplete="off"
          />

          <button id="sendBtn">➤</button>
        </div>
      </div>
    </div>

    <!-- IMPORTANT: correct path -->

    <script src="../js/script.js"></script>
  </body>
</html>
