<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScriptGen</title>

    <link rel="stylesheet" href="../css/scriptgen.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

    <!-- LOTTIE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.6/lottie.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">




</head>

<body>

    <div id="particles-js"></div>

    <div class="container">

        <div class="sidebar">

            <div class="logo" onclick="window.location.href = '../index.html'">
                <div class="logo-icon">M</div>
                <span>MovCap</span>
            </div>

            <button class="new-script glow-btn">+ New Recap</button>

            <button class="story-btn" onclick="window.location.href='../pages/storyboard.html'">Go to Story
                →</button>

            <div class="history">

                <h4>History</h4>

                <ul id="historyList"></ul>

            </div>

        </div>

        <!-- MAIN -->

        <div class="main">

            <div class="header">

                Recap

                <button id="exportBtn">Export Recap</button>

            </div>

            <div class="chat-area" id="chatArea">

                <div class="welcome" id="welcome">

                    <div id="aiAnimation" style="width:120px;margin:auto;"></div>

                    <h1>Welcome to <span>Recap</span></h1>

                    <p>
                        Enter a movie name, tone, or instructions to generate a cinematic recap script.
                    </p>

                    <div class="suggestions">

                        <button>Inception</button>
                        <button>Interstellar</button>
                        <button>The Dark Knight</button>

                    </div>

                </div>

            </div>

            <div class="input-bar">

                <input id="userInput" type="text" placeholder="Enter movie name, tone, or instructions...">

                <button id="sendBtn" class="send-btn">➤</button>

            </div>

        </div>

    </div>




    <script src="../js/scriptgen.js"></script>


</body>

</html>
